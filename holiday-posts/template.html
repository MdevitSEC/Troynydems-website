<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Noto+Color+Emoji&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{background:__BG__;font-family:Montserrat,sans-serif;color:__INK__;position:relative}
.bar{position:absolute;left:0;top:0;width:100%;height:24px;background:__BAR__}
